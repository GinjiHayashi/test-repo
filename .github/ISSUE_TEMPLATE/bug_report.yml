name: 🐛 バグ報告
description: 不具合や想定外の動作を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。再現できる情報があるほど早く対応できます。

  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の Issue が既に存在しないことを確認した
          required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような問題が起きているかを簡潔に記載してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題を再現するための手順を記載してください
      placeholder: |
        1. '...' を開く
        2. '...' をクリックする
        3. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どうなるべきかを記載してください
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きたかを記載してください
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 問題が発生した環境を記載してください
      placeholder: |
        - OS: macOS 15 / Windows 11 / Ubuntu 24.04
        - ブラウザ / ランタイム: Chrome 130 / Node.js 22
        - バージョン / コミット: v1.2.3 / abc1234
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: ログ・エラーメッセージ
      description: 関連するログがあれば貼り付けてください（自動でコードブロックになります）
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: スクリーンショット・補足情報
      description: スクリーンショットやその他の補足があれば記載してください
    validations:
      required: false
